<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" font-family="'Noto Sans JP',sans-serif">
  <defs>
    <linearGradient id="hd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE6A9"/><stop offset="1" stop-color="#FFF3D0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#B47850" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1000" height="680" fill="#FFFDF8"/>

  <!-- Title -->
  <circle cx="60" cy="52" r="22" fill="#F6BE56"/>
  <text x="94" y="46" font-size="26" font-weight="700" fill="#2E2A26">ひだまりの家 業務支援システム「ケアコンパス」</text>
  <text x="94" y="72" font-size="15" fill="#6B6259">仕様駆動MVP Lv.3 ／ 単一HTML・localStorage・外部連携なしのモック構成</text>

  <!-- Layer 1: UI -->
  <rect x="40" y="110" width="920" height="150" rx="16" fill="#fff" stroke="#EDE4D8" filter="url(#sh)"/>
  <text x="64" y="140" font-size="16" font-weight="700" fill="#B23F1C">① プレゼンテーション層（5タブ UI・白ベース）</text>
  <g font-size="14" fill="#2E2A26">
    <rect x="64"  y="158" width="160" height="80" rx="10" fill="#FDF8F2" stroke="#EDE4D8"/>
    <text x="144" y="196" text-anchor="middle">📊 ダッシュボード</text>
    <text x="144" y="216" text-anchor="middle" font-size="12" fill="#6B6259">KPI・アラート・🤖</text>

    <rect x="240" y="158" width="160" height="80" rx="10" fill="#FDF8F2" stroke="#EDE4D8"/>
    <text x="320" y="196" text-anchor="middle">👥 利用者管理</text>
    <text x="320" y="216" text-anchor="middle" font-size="12" fill="#6B6259">100点・3層振分</text>

    <rect x="416" y="158" width="160" height="80" rx="10" fill="#FDF8F2" stroke="#EDE4D8"/>
    <text x="496" y="196" text-anchor="middle">📝 リハビリ記録</text>
    <text x="496" y="216" text-anchor="middle" font-size="12" fill="#6B6259">バイタル・気づき</text>

    <rect x="592" y="158" width="160" height="80" rx="10" fill="#FDF8F2" stroke="#EDE4D8"/>
    <text x="672" y="196" text-anchor="middle">✅ 承認ワークフロー</text>
    <text x="672" y="216" text-anchor="middle" font-size="12" fill="#6B6259">段階ゲート引継</text>

    <rect x="768" y="158" width="168" height="80" rx="10" fill="#FDF8F2" stroke="#EDE4D8"/>
    <text x="852" y="196" text-anchor="middle">📈 分析レポート</text>
    <text x="852" y="216" text-anchor="middle" font-size="12" fill="#6B6259">分布・トレンド</text>
  </g>

  <!-- arrow -->
  <path d="M500 260 L500 300" stroke="#D9552B" stroke-width="3" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#D9552B"/></marker></defs>

  <!-- Layer 2: Logic -->
  <rect x="40" y="310" width="920" height="150" rx="16" fill="#fff" stroke="#EDE4D8" filter="url(#sh)"/>
  <text x="64" y="340" font-size="16" font-weight="700" fill="#B23F1C">② アプリケーションロジック層（クライアントJS）</text>
  <g font-size="13.5" fill="#2E2A26">
    <rect x="64"  y="358" width="205" height="82" rx="10" fill="#FFF6E8" stroke="#F0D8A8"/>
    <text x="166" y="392" text-anchor="middle" font-weight="600">ケアスコア算定エンジン</text>
    <text x="166" y="414" text-anchor="middle" font-size="12" fill="#6B6259">ADL+認知+安定=0〜100 → 3層</text>

    <rect x="285" y="358" width="205" height="82" rx="10" fill="#FFF6E8" stroke="#F0D8A8"/>
    <text x="387" y="392" text-anchor="middle" font-weight="600">承認ステートマシン</text>
    <text x="387" y="414" text-anchor="middle" font-size="12" fill="#6B6259">下書→提出→確認→承認 / 差戻</text>

    <rect x="506" y="358" width="205" height="82" rx="10" fill="#FFF6E8" stroke="#F0D8A8"/>
    <text x="608" y="392" text-anchor="middle" font-weight="600">🤖 AIインサイト生成</text>
    <text x="608" y="414" text-anchor="middle" font-size="12" fill="#6B6259">データから示唆を自動文生成</text>

    <rect x="727" y="358" width="209" height="82" rx="10" fill="#FFF6E8" stroke="#F0D8A8"/>
    <text x="831" y="392" text-anchor="middle" font-weight="600">モーダル/トースト UI</text>
    <text x="831" y="414" text-anchor="middle" font-size="12" fill="#6B6259">confirm不使用の確認基盤</text>
  </g>

  <path d="M500 460 L500 500" stroke="#D9552B" stroke-width="3" marker-end="url(#a)"/>

  <!-- Layer 3: Data -->
  <rect x="40" y="510" width="920" height="130" rx="16" fill="#fff" stroke="#EDE4D8" filter="url(#sh)"/>
  <text x="64" y="540" font-size="16" font-weight="700" fill="#B23F1C">③ データ永続層（ブラウザ localStorage）</text>
  <g font-size="13.5" fill="#2E2A26">
    <rect x="64" y="556" width="270" height="66" rx="10" fill="#EAF3DE" stroke="#CFE0B8"/>
    <text x="199" y="584" text-anchor="middle" font-weight="600">STORE_KEY = 'hidamari_care_v1'</text>
    <text x="199" y="606" text-anchor="middle" font-size="12" fill="#6B6259">スキーマ昇格対応（バージョン付）</text>

    <rect x="350" y="556" width="270" height="66" rx="10" fill="#EAF3DE" stroke="#CFE0B8"/>
    <text x="485" y="584" text-anchor="middle" font-weight="600">users[] ／ records[]</text>
    <text x="485" y="606" text-anchor="middle" font-size="12" fill="#6B6259">サンプル10名・記録15件シード</text>

    <rect x="636" y="556" width="300" height="66" rx="10" fill="#EAF3DE" stroke="#CFE0B8"/>
    <text x="786" y="584" text-anchor="middle" font-weight="600">将来：REST API / DB へ差替</text>
    <text x="786" y="606" text-anchor="middle" font-size="12" fill="#6B6259">同スキーマのまま外部連携へ拡張</text>
  </g>
</svg>
